# Orchestrates the backend API and frontend web app. There is no database
# service here on purpose — MONGO_URI (in backend/.env) points at a hosted
# MongoDB Atlas cluster, not a local container.
services:
  backend:
    build:
      context: ./backend
    container_name: rockbridge-backend
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      # Bind mount (not a named volume) so uploaded files live at the same
      # backend/uploads path on disk whether the app runs in Docker or
      # directly with `npm run dev` — nothing gets duplicated or orphaned.
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time (see frontend/Dockerfile).
        # Browsers hit this from the host machine, so it must be a URL the
        # *browser* can reach (the published backend port below), not the
        # in-network "backend" service name.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:5000/api}
    container_name: rockbridge-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped
